<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAR Ship Detector</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────── -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>⚓ SAR Ship Detector</h1>
  </div>

  <div class="sidebar-body">

    <!-- Input -->
    <div class="section-title">Input</div>

    <div class="form-group">
      <div class="drop-zone" id="dropZone">
        <span class="drop-icon">📡</span>
        <div id="dropLabel">Drop GeoTIFF or click to browse</div>
      </div>
      <input type="file" id="fi" accept=".tif,.tiff" style="display:none">
    </div>

    <div class="form-group">
      <label>Model</label>
      <select id="modelType">
        <option value="yolo">YOLO26s</option>
        <option value="fasterrcnn">Faster R-CNN</option>
      </select>
    </div>

    <!-- SAR Parameters -->
    <div class="section-title">SAR Parameters</div>

    <div class="form-group">
      <label>Polarization</label>
      <select id="polarization">
        <option value="VV">VV</option>
        <option value="VH">VH</option>
        <option value="HH">HH</option>
        <option value="HV">HV</option>
      </select>
    </div>

    <div class="form-group">
      <label>Input format</label>
      <select id="inputFormat">
        <option value="byte">Byte 0–255 (SNAP / QGIS export)</option>
        <option value="db">dB sigma0</option>
        <option value="linear">Linear sigma0</option>
      </select>
    </div>

    <!-- Detection -->
    <div class="section-title">Detection</div>

    <div class="form-group">
      <label>Window size (px)</label>
      <select id="windowSize">
        <option value="192">192</option>
        <option value="224">224</option>
        <option value="448">448</option>
        <option value="512">512</option>
        <option value="800" selected>800</option>
        <option value="1024">1024</option>
      </select>
    </div>

    <div class="form-group">
      <label>Target size for interpolation (px)</label>
      <select id="targetSize">
        <option value="512">512</option>
        <option value="800" selected>800</option>
        <option value="1024">1024</option>
      </select>
      <small style="color: var(--text-faint);">Interpolate smaller windows to match HRSID training data</small>
    </div>

    <div class="form-group">
      <label>Overlap</label>
      <div class="range-row">
        <input type="range" id="overlapPct" min="0" max="0.75" step="0.05" value="0.25">
        <span class="range-val" id="overlapVal">25%</span>
      </div>
    </div>

    <div class="form-group">
      <label>Score threshold</label>
      <div class="range-row">
        <input type="range" id="scoreThresh" min="0.05" max="0.95" step="0.05" value="0.3">
        <span class="range-val" id="scoreVal">0.30</span>
      </div>
    </div>

    <div class="form-group">
      <label>NMS IoU</label>
      <div class="range-row">
        <input type="range" id="nmsIou" min="0.1" max="0.7" step="0.05" value="0.3">
        <span class="range-val" id="nmsVal">0.30</span>
      </div>
    </div>

    <!-- Contrast Enhancement -->
    <div class="section-title">Contrast Enhancement</div>

    <div class="form-group check-row">
      <input type="checkbox" id="contrastEnabled">
      <label for="contrastEnabled">Enable contrast enhancement</label>
    </div>

    <div id="contrastParams">
      <div class="form-group">
        <label>Method</label>
        <select id="contrastMethod">
          <option value="percentile">Percentile stretch (recommended)</option>
          <option value="minmax">Min-max stretch</option>
        </select>
      </div>

      <div class="form-group">
        <label>Low percentile</label>
        <div class="range-row">
          <input type="range" id="percLow" min="0" max="10" step="0.5" value="5">
          <span class="range-val" id="percLowV">5%</span>
        </div>
      </div>

      <div class="form-group">
        <label>High percentile</label>
        <div class="range-row">
          <input type="range" id="percHigh" min="90" max="100" step="0.5" value="95">
          <span class="range-val" id="percHighV">95%</span>
        </div>
      </div>

      <div class="form-group">
        <label>Gamma  &nbsp;<span style="color:var(--text-faint)">(1.0 = unchanged · &lt;1 brighter)</span></label>
        <div class="range-row">
          <input type="range" id="gamma" min="0.3" max="3.0" step="0.1" value="1.0">
          <span class="range-val" id="gammaV">1.0</span>
        </div>
      </div>

      <div class="form-group check-row">
        <input type="checkbox" id="clahe">
        <label for="clahe">CLAHE &nbsp;<span style="color:var(--text-faint)">(best for ship visibility)</span></label>
      </div>
    </div>

    <!-- Storage -->
    <div class="section-title">Storage</div>

    <div class="form-group">
      <label>Auto-delete after (minutes · −1 = never)</label>
      <input type="number" id="ttlMinutes" value="60" min="-1" step="10">
    </div>

    <!-- Actions -->
    <div class="section-title">Run</div>

    <button class="btn btn-primary" id="runBtn" disabled>▶ Run Detection</button>
    <button class="btn btn-secondary" id="newBtn">+ New Job</button>
    <button class="btn btn-danger" id="abortBtn" style="display:none">✕ Abort</button>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="pFill" style="width:0%"></div>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

  </div><!-- /sidebar-body -->
</div><!-- /sidebar -->

<!-- ── Main ────────────────────────────────────────────── -->
<div class="main">

  <div class="topbar">
    <span class="topbar-title">Preview</span>
    <span class="topbar-file"  id="previewFilename"></span>
    <span class="topbar-count" id="detCount"></span>
  </div>

  <div class="content">

    <!-- Preview panel -->
    <div class="panel" id="panel">
      <div class="preview-empty">
        <span class="preview-empty-icon">🛰</span>
        Submit a job to see preview
      </div>
    </div>

    <!-- Jobs pane -->
    <div class="jobs-pane">
      <div class="jobs-header">Jobs</div>
      <div class="jobs-list" id="jobsList"></div>
    </div>

  </div>
</div><!-- /main -->

<!-- ── Scripts — load order matters ───────────────────── -->
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/preview.js"></script>
<script src="/static/js/poller.js"></script>
<script src="/static/js/jobs.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
