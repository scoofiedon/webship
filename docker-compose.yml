services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./shared:/app/shared
      - ./jobs:/jobs
      - ./models:/models
    environment:
      - REDIS_URL=redis://redis:6379
      - JOBS_DIR=/jobs
      - MODELS_DIR=/models
      - JOB_TTL_MINUTES=60
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - ./shared:/app/shared
      - ./jobs:/jobs
      - ./models:/models
      - ./gshhg:/gshhg
    environment:
      - REDIS_URL=redis://redis:6379
      - JOBS_DIR=/jobs
      - MODELS_DIR=/models
      - GSHHG_SHP_PATH=/gshhg/gshhg-shp-2.3.7/GSHHS_shp/f/GSHHS_f_L1.shp
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  redis_data: